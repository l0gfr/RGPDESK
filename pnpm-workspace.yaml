packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 1440
# Exact official tarball reviewed for the security update authorized on 2026-10-04.
minimumReleaseAgeExclude:
  - "http-cache-semantics@4.3.0"
blockExoticSubdeps: true
packageManagerStrictVersion: true
strictDepBuilds: true

overrides:
  "@types/hast": "3.0.4"
  "@xmldom/xmldom": "0.9.12"
  devalue: "5.9.3"
  fast-uri: "3.1.9"
  http-cache-semantics: "4.3.0"
  js-yaml: "4.3.2"
  postcss: "8.5.26"
  sharp: "0.35.5"
  smol-toml: "1.9.0"
  source-map-js: "1.2.2"
  svgo: "4.1.0"
  vite: "8.2.4"
  "zod@>=4.0.0 <4.6.6": "4.6.6"
  "undici@>=8.0.0 <8.12.2": "8.12.2"

allowBuilds:
  esbuild: true
  sharp: true
