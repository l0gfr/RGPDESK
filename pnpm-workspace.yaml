  "devalue@>=5.0.0 <6.0.0": "5.9.3"
  fast-uri: "3.1.9"
  http-cache-semantics: "4.3.0"
  js-yaml: "4.3.2"
  postcss: "8.5.30"
  sharp: "0.35.5"
  smol-toml: "1.9.1"
  source-map-js: "1.2.2"
  svgo: "4.1.0"
  vite: "8.3.5"
  "zod@>=4.0.0 <4.6.6": "4.6.6"
  "undici@>=8.0.0 <8.12.2": "8.12.2"

allowBuilds:
